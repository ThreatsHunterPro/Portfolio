# Blueprint Render : déploie l'API et le site en une fois
# Render > New > Blueprint > sélectionner ce dépôt
services:
  # --- API Express (projets, profil, contact) ---
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    rootDir: BackEnd
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # URL publique du site, pour le CORS (ex. https://portfolio-xxxx.onrender.com)
      - key: FRONTEND_URL
        sync: false

  # --- Site React (fichiers statiques) ---
  - type: web
    name: portfolio
    runtime: static
    rootDir: FrontEnd
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # URL publique de l'API (ex. https://portfolio-api-xxxx.onrender.com)
      - key: VITE_API_URL
        sync: false
    # SPA : toutes les routes renvoient vers index.html (React Router)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /projects/*
        name: Cache-Control
        value: public, max-age=604800
